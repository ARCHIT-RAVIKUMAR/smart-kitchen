<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f6b4f">
    <title th:text="${title} + ' | Smart Kitchen Inventory'">Smart Kitchen Inventory</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B3%3C/text%3E%3C/svg%3E">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (!t) { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) { /* ignore */ }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-kitchen navbar-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-egg-fried"></i> Smart Kitchen
            <span class="tagline">Making Kitchen Inventory Smarter &amp; Simpler</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'inventory'} ? 'active'" th:href="@{/inventory}"><i class="bi bi-box-seam"></i> Inventory</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" th:classappend="${active == 'low' or active == 'expiry'} ? 'active'"
                       href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="bi bi-bell"></i> Alerts</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/inventory/low-stock}"><i class="bi bi-exclamation-triangle"></i> Low stock</a></li>
                        <li><a class="dropdown-item" th:href="@{/inventory/expiry}"><i class="bi bi-hourglass-split"></i> Expiry</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'shopping'} ? 'active'" th:href="@{/inventory/shopping-list}"><i class="bi bi-cart3"></i> Shopping list</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'help'} ? 'active'" th:href="@{/help}"><i class="bi bi-question-circle"></i> Help</a></li>
                <li class="nav-item ms-lg-2 my-1 my-lg-0">
                    <button type="button" id="themeToggle" class="btn btn-sm btn-outline-light" aria-label="Switch dark / light mode">
                        <i id="themeIcon" class="bi bi-moon-stars"></i>
                    </button>
                </li>
                <li class="nav-item ms-lg-2 my-1 my-lg-0">
                    <a class="btn btn-sm btn-light fw-semibold" th:href="@{/inventory/new}"><i class="bi bi-plus-lg"></i> Add item</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="messages">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${successMessage}">Done</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${warningMessage}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${warningMessage}">Warning</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-x-circle"></i> <span th:text="${errorMessage}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<th:block th:fragment="stockBadge(s)">
    <span class="badge" th:classappend="${s.badgeClass}" th:text="${s.label}">Status</span>
</th:block>

<div th:fragment="statCard(label, value, icon, tone, href)" class="col-6 col-md-4 col-xl-2">
    <a class="text-decoration-none" th:href="${href}">
        <div class="card stat-card shadow-sm h-100" th:classappend="${tone}">
            <div class="card-body d-flex align-items-center gap-3">
                <div class="stat-icon"><i class="bi" th:classappend="${icon}"></i></div>
                <div>
                    <div class="stat-label" th:text="${label}">Label</div>
                    <div class="stat-value" th:text="${value}">0</div>
                </div>
            </div>
        </div>
    </a>
</div>

<th:block th:fragment="footer">
    <footer class="footer text-center">Smart Kitchen Inventory System &middot; College Java OOP Project</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
