<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Not Found')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('none')}"></nav>
<main class="container py-5 text-center">
    <div class="display-1">&#128269;</div>
    <h1 class="h3 page-title">404 &ndash; Not found</h1>
    <p class="text-muted" th:text="${#strings.isEmpty(message)} ? 'The page or item you asked for could not be found.' : ${message}">Not found</p>
    <a class="btn btn-kitchen" th:href="@{/}">Back to dashboard</a>
    <a class="btn btn-outline-kitchen" th:href="@{/inventory}">View inventory</a>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
