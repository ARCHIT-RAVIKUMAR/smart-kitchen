<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('none')}"></nav>
<main class="container py-5 text-center">
    <div class="display-1">&#9888;&#65039;</div>
    <h1 class="h3 page-title">Something went wrong</h1>
    <p class="text-muted" th:text="${#strings.isEmpty(message)} ? 'An unexpected problem occurred. Please try again.' : ${message}">Error</p>
    <a class="btn btn-kitchen" th:href="@{/}">Back to dashboard</a>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
