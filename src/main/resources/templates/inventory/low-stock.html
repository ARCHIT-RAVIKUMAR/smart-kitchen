<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Low Stock')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('low')}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: messages}"></div>
    <h1 class="h3 page-title mb-3">Low &amp; out-of-stock items</h1>

    <h2 class="h5 text-danger mb-2">Out of stock <span class="badge text-bg-danger" th:text="${#lists.size(outOfStock)}">0</span></h2>
    <th:block th:unless="${#lists.isEmpty(outOfStock)}"><div th:replace="~{fragments/tables :: itemTable(${outOfStock})}"></div></th:block>
    <div th:if="${#lists.isEmpty(outOfStock)}" class="card shadow-sm"><div class="card-body text-muted">Nothing is out of stock. &#9989;</div></div>

    <h2 class="h5 text-warning-emphasis mt-4 mb-2">Low stock <span class="badge text-bg-warning" th:text="${#lists.size(lowStock)}">0</span></h2>
    <th:block th:unless="${#lists.isEmpty(lowStock)}"><div th:replace="~{fragments/tables :: itemTable(${lowStock})}"></div></th:block>
    <div th:if="${#lists.isEmpty(lowStock)}" class="card shadow-sm"><div class="card-body text-muted">No items are running low. &#9989;</div></div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
