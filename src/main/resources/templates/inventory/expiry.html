<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Expiry')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('expiry')}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: messages}"></div>
    <h1 class="h3 page-title mb-1">Expiring &amp; expired items</h1>
    <p class="text-muted" th:text="'Expiring soon means the expiry date is within the next ' + ${expiringSoonDays} + ' days (including today).'">info</p>

    <h2 class="h5 text-danger mb-2">Expired <span class="badge text-bg-danger" th:text="${#lists.size(expired)}">0</span></h2>
    <th:block th:unless="${#lists.isEmpty(expired)}"><div th:replace="~{fragments/tables :: itemTable(${expired})}"></div></th:block>
    <div th:if="${#lists.isEmpty(expired)}" class="card shadow-sm"><div class="card-body text-muted">No expired items. &#9989;</div></div>

    <h2 class="h5 text-warning-emphasis mt-4 mb-2">Expiring soon <span class="badge text-bg-warning" th:text="${#lists.size(expiringSoon)}">0</span></h2>
    <th:block th:unless="${#lists.isEmpty(expiringSoon)}"><div th:replace="~{fragments/tables :: itemTable(${expiringSoon})}"></div></th:block>
    <div th:if="${#lists.isEmpty(expiringSoon)}" class="card shadow-sm"><div class="card-body text-muted">Nothing is expiring soon. &#9989;</div></div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
