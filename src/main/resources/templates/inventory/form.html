<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('add')}"></nav>
<main class="container py-4" style="max-width: 820px;">
    <h1 class="h3 page-title mb-3" th:text="${itemId == null} ? 'Add inventory item' : 'Edit inventory item'">Item</h1>

    <div th:if="${#fields.hasErrors('${itemForm.*}')}" class="alert alert-danger" role="alert">
        Please fix the highlighted fields below.
    </div>

    <form th:object="${itemForm}"
          th:action="${itemId == null} ? @{/inventory} : @{/inventory/{id}(id=${itemId})}"
          method="post" novalidate class="card shadow-sm feedback-form">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-8">
                    <label for="name" class="form-label">Item name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control" maxlength="100"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{name}">Error</div>
                </div>
                <div class="col-md-4">
                    <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
                    <select th:field="*{category}" class="form-select"
                            th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                        <option value="">Choose...</option>
                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{category}">Error</div>
                </div>

                <div class="col-md-4">
                    <label for="quantity" class="form-label">Quantity <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" min="0" th:field="*{quantity}" class="form-control"
                           th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{quantity}">Error</div>
                </div>
                <div class="col-md-4">
                    <label for="unit" class="form-label">Unit <span class="text-danger">*</span></label>
                    <select th:field="*{unit}" class="form-select"
                            th:classappend="${#fields.hasErrors('unit')} ? 'is-invalid'">
                        <option value="">Choose...</option>
                        <option th:each="u : ${units}" th:value="${u}" th:text="${u.label}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{unit}">Error</div>
                </div>
                <div class="col-md-4">
                    <label for="minimumStock" class="form-label">Minimum stock <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" min="0" th:field="*{minimumStock}" class="form-control"
                           th:classappend="${#fields.hasErrors('minimumStock')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{minimumStock}">Error</div>
                    <div class="form-text">Low-stock alert starts at or below this amount.</div>
                </div>

                <div class="col-md-6">
                    <label for="purchaseDate" class="form-label">Purchase date</label>
                    <input type="date" th:field="*{purchaseDate}" class="form-control"
                           th:classappend="${#fields.hasErrors('purchaseDate')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{purchaseDate}">Error</div>
                </div>
                <div class="col-md-6">
                    <label for="expiryDate" class="form-label">Expiry date</label>
                    <input type="date" th:field="*{expiryDate}" class="form-control"
                           th:classappend="${#fields.hasErrors('expiryDate')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{expiryDate}">Error</div>
                    <div class="form-text">Leave empty if the item does not expire.</div>
                </div>

                <div class="col-12">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea th:field="*{notes}" rows="3" maxlength="500" class="form-control"
                              th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:errors="*{notes}">Error</div>
                </div>
            </div>
        </div>
        <div class="card-footer bg-body d-flex gap-2">
            <button type="submit" class="btn btn-kitchen"
                    th:text="${itemId == null} ? 'Add item' : 'Save changes'">Save</button>
            <a class="btn btn-outline-secondary"
               th:href="${itemId == null} ? @{/inventory} : @{/inventory/{id}(id=${itemId})}">Cancel</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
