spring.application.name=smart-kitchen-inventory
server.port=${PORT:8080}

# --- Database (override with env vars or config/application.properties) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_kitchen}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Flyway creates/updates the tables; Hibernate must not touch the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Never show stack traces / internal messages to users
server.error.include-stacktrace=never
server.error.include-message=never

# --- Application settings ---
kitchen.expiry-soon-days=${EXPIRY_SOON_DAYS:7}
kitchen.timezone=${APP_TIMEZONE:Asia/Kolkata}
kitchen.seed-demo-data=${SEED_DEMO_DATA:true}

# --- Hosting (Render) ---
# Trust the proxy headers so redirects use https
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.compression.enabled=true
# Small pool: free Supabase/Render limits
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000
